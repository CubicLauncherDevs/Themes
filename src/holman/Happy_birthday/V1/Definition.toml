[background]
reference_path = "bg.png"
image_blur = 0.0
image_opacity = 0.85

[colors]
accent = "#CDA06A"
"accent-rgb" = "205, 160, 106"
"accent-hover" = "#DFB47C"
"accent-active" = "#AD8250"
"accent-text" = "#1D1610"
"accent-subtle" = "rgba(205, 160, 106, 0.15)"

[text]
primary = "#EDE8E4"
secondary = "#B9AFA9"
muted = "#7D7172"
accent = "#CDA06A"

[borders]
color = "#3A3737"
"color-hover" = "#CDA06A"
radius = "10px"
"radius-sm" = "6px"
"radius-lg" = "14px"
width = "1px"

[shadows]
"shadow-sm" = "0 1px 3px rgba(0,0,0,0.4)"
"shadow-md" = "0 4px 8px rgba(0,0,0,0.35)"
"shadow-lg" = "0 8px 24px rgba(0,0,0,0.45)"
"glow-accent" = "0 0 12px rgba(205, 160, 106, 0.25)"
"glow-accent-strong" = "0 0 20px rgba(205, 160, 106, 0.4)"
"glow-error" = "0 0 12px rgba(197, 108, 108, 0.25)"
"glow-success" = "0 0 12px rgba(126, 191, 142, 0.25)"

[backgrounds]
main = "#141313"
sidebar = "#0E0D0D"
card = "#242222"
"item-active" = "#CDA06A"
overlay = "rgba(0,0,0,0.7)"
input = "#111010"

[layout]
"font-family" = "'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif"
"font-size-base" = "15px"
"font-size-sm" = "13px"
"font-size-lg" = "17px"

[others]
"icon-filter" = "brightness(0) invert(0.91)"
"icon-filter-accent" = "brightness(0) invert(0.55) sepia(1) saturate(3) hue-rotate(5deg)"
"icon-filter-error" = "brightness(0) invert(0.4) sepia(1) saturate(10) hue-rotate(316deg)"
"icon-filter-success" = "brightness(0) invert(0.65) sepia(1) saturate(3) hue-rotate(85deg)"
"icon-filter-warning" = "brightness(0) invert(0.6) sepia(1) saturate(5) hue-rotate(5deg)"
"icon-filter-info" = "brightness(0) invert(0.55) sepia(1) saturate(3) hue-rotate(5deg)"
"icon-filter-muted" = "brightness(0) invert(0.60)"
"color-success" = "#7EBF8E"
"color-success-rgb" = "126, 191, 142"
"color-error" = "#C56C6C"
"color-error-rgb" = "197, 108, 108"
"color-warning" = "#D4A86A"
"color-warning-rgb" = "212, 168, 106"
"color-info" = "#CDA06A"
"color-info-rgb" = "205, 160, 106"
"color-status-starting" = "#D4A86A"
"color-status-started" = "#7EBF8E"
"color-status-stopped" = "#C56C6C"
"color-status-error" = "#C56C6C"
"scrollbar-track" = "#0E0D0D"
"scrollbar-thumb" = "#CDA06A"
"scrollbar-thumb-hover" = "#DFB47C"
"sidebar-width" = "260px"
"transition-fast" = "0.12s ease"
"transition-base" = "0.2s ease"
"transition-slow" = "0.35s ease"

[backdrop]
dropdown = 8.0
modal = 4.0
overlay = 4.0
viewer = 8.0
float = 8.0
panel = 5.0
button = 4.0
