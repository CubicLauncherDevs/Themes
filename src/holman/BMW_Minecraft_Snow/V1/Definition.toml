[background]
reference_path = "bg.gif"
image_blur = 0.0
image_opacity = 1.0

[backgrounds]
main = "#08090b"
sidebar = "#0d0f12"
card = "#15181c"
item-active = "#252a30"
overlay = "rgba(5, 7, 9, 0.58)"
input = "#101216"

[colors]
accent = "#a8aeb5"
accent-rgb = "168,174,181"
accent-hover = "#d7dbe0"
accent-active = "#8d949c"
accent-text = "#08090b"
accent-subtle = "rgba(168,174,181,0.12)"
color-success = "#b8c1ca"
color-success-rgb = "184,193,202"
color-error = "#e53935"
color-error-rgb = "229,57,53"
color-warning = "#d8b36a"
color-warning-rgb = "216,179,106"
color-info = "#b58cff"
color-info-rgb = "181,140,255"
color-status-starting = "#b58cff"
color-status-started = "#b8c1ca"
color-status-stopped = "#08090b"
color-status-error = "#e53935"

[text]
primary = "#f2f4f6"
secondary = "#c7ccd1"
muted = "#858c94"
accent = "#d9dde2"

[borders]
color = "#2b3036"
color-hover = "#555d66"
radius = "8px"
radius-sm = "4px"
radius-lg = "12px"

[shadows]
shadow-sm = "0 1px 3px rgba(0,0,0,0.65)"
shadow-md = "0 4px 14px rgba(0,0,0,0.72)"
shadow-lg = "0 8px 28px rgba(0,0,0,0.82)"
glow-accent = "0 0 16px rgba(181,140,255,0.18)"
glow-accent-strong = "0 0 28px rgba(181,140,255,0.30)"

[others]
scrollbar-track = "#0d0f12"
scrollbar-thumb = "#30363d"
scrollbar-thumb-hover = "#555d66"

[layout]
font-size-base = "16px"
sidebar-width = "260px"
