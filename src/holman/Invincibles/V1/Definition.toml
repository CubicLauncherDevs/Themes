[background]
reference_path = "bg.gif"
image_blur = 0.0
image_opacity = 0.85

[colors]
accent = "#D9481F"
"accent-rgb" = "217, 72, 31"
"accent-hover" = "#F06B3B"
"accent-active" = "#B23414"
"accent-text" = "#FFF1E8"
"accent-subtle" = "rgba(217, 72, 31, 0.15)"

[text]
primary = "#F2E4D6"
secondary = "#D9B79A"
muted = "#8C6F62"
accent = "#D9481F"

[borders]
color = "#3A1712"
"color-hover" = "#D9481F"
radius = "10px"
"radius-sm" = "6px"
"radius-lg" = "14px"
width = "1px"

[shadows]
"shadow-sm" = "0 1px 3px rgba(0,0,0,0.4)"
"shadow-md" = "0 4px 8px rgba(0,0,0,0.35)"
"shadow-lg" = "0 8px 24px rgba(0,0,0,0.45)"
"glow-accent" = "0 0 12px rgba(217, 72, 31, 0.25)"
"glow-accent-strong" = "0 0 20px rgba(217, 72, 31, 0.4)"
"glow-error" = "0 0 12px rgba(197, 108, 108, 0.25)"
"glow-success" = "0 0 12px rgba(126, 191, 142, 0.25)"

[backgrounds]
main = "#0C0708"
sidebar = "#080505"
card = "#241210"
"item-active" = "#D9481F"
overlay = "rgba(0,0,0,0.7)"
input = "#0A0505"

[layout]
"font-family" = "'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif"
"font-size-base" = "16px"
"font-size-sm" = "14px"
"font-size-lg" = "18px"

[others]
"icon-filter" = "brightness(0) invert(0.91)"
"icon-filter-accent" = "brightness(0) invert(0.55) sepia(1) saturate(3) hue-rotate(-15deg)"
"icon-filter-error" = "brightness(0) invert(0.4) sepia(1) saturate(10) hue-rotate(316deg)"
"icon-filter-success" = "brightness(0) invert(0.65) sepia(1) saturate(3) hue-rotate(85deg)"
"icon-filter-warning" = "brightness(0) invert(0.6) sepia(1) saturate(5) hue-rotate(5deg)"
"icon-filter-info" = "brightness(0) invert(0.55) sepia(1) saturate(3) hue-rotate(-15deg)"
"icon-filter-muted" = "brightness(0) invert(0.60)"
"color-success" = "#7EBF8E"
"color-success-rgb" = "126, 191, 142"
"color-error" = "#C56C6C"
"color-error-rgb" = "197, 108, 108"
"color-warning" = "#D4A86A"
"color-warning-rgb" = "212, 168, 106"
"color-info" = "#D9481F"
"color-info-rgb" = "217, 72, 31"
"color-status-starting" = "#D4A86A"
"color-status-started" = "#7EBF8E"
"color-status-stopped" = "#C56C6C"
"color-status-error" = "#C56C6C"
"scrollbar-track" = "#080505"
"scrollbar-thumb" = "#D9481F"
"scrollbar-thumb-hover" = "#F06B3B"
"sidebar-width" = "260px"
"transition-fast" = "0.12s ease"
"transition-base" = "0.2s ease"
"transition-slow" = "0.35s ease"

[backdrop]
dropdown = 8.0
modal = 4.0
overlay = 4.0
viewer = 8.0
float = 8.0
panel = 5.0
button = 4.0
