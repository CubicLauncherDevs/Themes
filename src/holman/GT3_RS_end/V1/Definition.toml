[background]
reference_path = "bg.gif"
image_blur = 0.0
image_opacity = 1.0

[backgrounds]
main = "#080409"
sidebar = "#0d0710"
card = "#1a0e1f"
item-active = "#32153b"
overlay = "rgba(8, 4, 9, 0.56)"
input = "#110914"

[colors]
accent = "#c65adf"
accent-rgb = "198,90,223"
accent-hover = "#d976eb"
accent-active = "#ae46c8"
accent-text = "#fff6ff"
accent-subtle = "rgba(198,90,223,0.12)"
color-success = "#8fd6a8"
color-success-rgb = "143,214,168"
color-error = "#e86b8c"
color-error-rgb = "232,107,140"
color-warning = "#e2b56f"
color-warning-rgb = "226,181,111"
color-info = "#b7a0e3"
color-info-rgb = "183,160,227"
color-status-starting = "#c65adf"
color-status-started = "#8fd6a8"
color-status-stopped = "#080409"
color-status-error = "#e86b8c"

[text]
primary = "#f5eaf6"
secondary = "#dac5dd"
muted = "#a687aa"
accent = "#e39aef"

[borders]
color = "#3a2141"
color-hover = "#69436f"
radius = "8px"
radius-sm = "4px"
radius-lg = "12px"

[shadows]
shadow-sm = "0 1px 3px rgba(0,0,0,0.6)"
shadow-md = "0 4px 14px rgba(0,0,0,0.7)"
shadow-lg = "0 8px 28px rgba(0,0,0,0.78)"
glow-accent = "0 0 16px rgba(198,90,223,0.22)"
glow-accent-strong = "0 0 28px rgba(198,90,223,0.35)"

[others]
scrollbar-track = "#0d0710"
scrollbar-thumb = "#3a2141"
scrollbar-thumb-hover = "#69436f"

[layout]
font-size-base = "16px"
sidebar-width = "260px"
