[background]
reference_path = "bg.jpg"
image_blur = 0.5
image_opacity = 0.68

[colors]
accent = "#6FA8DE"
accent-hover = "#85B8E8"
accent-active = "#5C93C4"
bg-main = "#0F151C"
bg-card = "rgba(18, 26, 34, 0.70)"
bg-sidebar = "rgba(11, 16, 22, 0.84)"
bg-sidebar-gradient = "linear-gradient(180deg, rgba(18, 26, 34, 0.86) 0%, rgba(9, 13, 18, 0.82) 100%)"
bg-item-active = "rgba(111, 168, 222, 0.18)"
bg-item-hover = "rgba(230, 240, 245, 0.08)"
bg-overlay = "rgba(7, 11, 15, 0.78)"
border = "rgba(230, 240, 245, 0.13)"
border-color = "rgba(230, 240, 245, 0.13)"
scrollbar-track = "transparent"
scrollbar-thumb = "rgba(230, 240, 245, 0.18)"
scrollbar-thumb-hover = "rgba(111, 168, 222, 0.62)"
success = "#8FAF9B"
warning = "#D2B47A"
error = "#C98181"

[text]
primary = "#E6F1F8"
secondary = "#AFC1CC"
muted = "#83919A"
accent = "#AED0EE"
inverse = "#0F151C"

[borders]
color = "rgba(236, 230, 245, 0.13)"
radius = "10px"
radius-sm = "7px"
radius-lg = "14px"

[layout]
sidebar-width = "248px"
spacing = "1rem"
font-size-base = "14px"

[shadows]
shadow-sm = "0 2px 8px rgba(0, 0, 0, 0.22)"
shadow-md = "0 10px 28px rgba(0, 0, 0, 0.34)"
shadow-lg = "0 18px 52px rgba(0, 0, 0, 0.48)"
glow-accent = "0 0 18px rgba(111, 168, 222, 0.24)"

[backgrounds]
input = "rgba(10, 8, 13, 0.72)"
button = "rgba(236, 230, 245, 0.08)"

[backdrop]
modal = 8.0
dropdown = 6.0

[others]
font-family = "Inter, ui-sans-serif, system-ui, sans-serif"
icon-filter = "brightness(0) saturate(100%) invert(88%) sepia(10%) saturate(600%) hue-rotate(175deg) brightness(103%) contrast(92%)"

[icons]
preview = "icons/preview.png"
