[background]
reference_path = "bg.gif"
image_blur = 0.0
image_opacity = 0.50
mode = "cover"
position = "center"
brightness = 0.70

[colors]
accent = "#d42a2a"
accent-rgb = "212, 42, 42"
accent-hover = "#bb2222"
accent-active = "#a01c1c"
accent-primary = "#d42a2a"
accent-text = "#fff6f4"
accent-subtle = "rgba(212,42,42,0.12)"
color-success = "#6fbf8b"
color-success-rgb = "111, 191, 139"
color-error = "#ff6b6b"
color-error-rgb = "255, 107, 107"
color-warning = "#e0a84f"
color-warning-rgb = "224, 168, 79"
color-info = "#7fa8c9"
color-info-rgb = "127, 168, 201"
color-status-starting = "#e0a84f"
color-status-started = "#6fbf8b"
color-status-stopped = "#4a3f3f"
color-status-error = "#ff6b6b"
clr-loader-vanilla = "#6fbf8b"
clr-loader-fabric = "#c9a86a"
clr-loader-forge = "#d42a2a"
clr-loader-quilt = "#a98fc0"

[text]
primary = "#f4eeec"
secondary = "#c6b7b3"
muted = "#8b7c79"
tertiary = "#8b7c79"
accent = "#ef8f8a"

[backgrounds]
main = "#0c0a0b"
sidebar = "#100d0e"
card = "#171314"
item-active = "#241c1d"
overlay = "rgba(6,4,5,0.86)"
input = "#090708"
surface = "#1b1617"

[borders]
color = "#2c2425"
color-hover = "#a83232"
focus = "var(--accent)"
width = "1px"
radius = "8px"
radius-sm = "4px"
radius-lg = "14px"

[layout]
sidebar-width = "252px"

[typography]
family = "Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif"
size_base = "14px"
size_sm = "12px"
size_label = "11px"
size_control = "13px"
size_lg = "16px"
line_height = "1.5"
weight_normal = "400"
weight_medium = "500"
weight_bold = "700"

[shadows]
shadow-sm = "0 1px 3px rgba(0,0,0,0.55)"
shadow-md = "0 6px 18px rgba(0,0,0,0.50)"
shadow-lg = "0 16px 40px rgba(0,0,0,0.60)"
glow-accent = "0 0 0 2px rgba(212,42,42,0.18)"
glow-accent-strong = "0 0 0 3px rgba(212,42,42,0.26)"
glow-error = "0 0 0 2px rgba(255,107,107,0.20)"
glow-success = "0 0 0 2px rgba(111,191,139,0.20)"

[backdrop]
modal = 8.0
dropdown = 10.0
panel = 8.0
overlay = 6.0
float = 10.0
viewer = 10.0

[others]
surface-rgb = "255, 255, 255"
surface-subtle = "rgba(255,255,255,0.035)"
surface-raised = "rgba(255,255,255,0.06)"
surface-dropdown = "#1b1617"
surface-input = "#090708"
surface-hover = "#231c1d"
surface-active = "#2d2425"
surface-selected = "#241c1d"
surface-card = "#171314"
toast-bg = "#1b1617"
toast-border = "#2c2425"
button-bg = "#1d1718"
button-hover-bg = "#2a2122"
btn-bg = "#1d1718"
item-bg = "#0f0c0d"
icon-filter = "brightness(0) saturate(100%) invert(94%) sepia(6%) saturate(400%) hue-rotate(340deg) brightness(102%) contrast(92%)"
icon-filter-accent = "brightness(0) saturate(100%) invert(38%) sepia(55%) saturate(2200%) hue-rotate(345deg) brightness(95%)"
icon-filter-success = "brightness(0) saturate(100%) invert(72%) sepia(22%) saturate(800%) hue-rotate(95deg) brightness(95%)"
icon-filter-error = "brightness(0) saturate(100%) invert(55%) sepia(60%) saturate(1800%) hue-rotate(340deg) brightness(105%)"
icon-filter-warning = "brightness(0) saturate(100%) invert(76%) sepia(45%) saturate(800%) hue-rotate(5deg) brightness(100%)"
icon-filter-info = "brightness(0) saturate(100%) invert(70%) sepia(18%) saturate(700%) hue-rotate(180deg) brightness(95%)"
icon-filter-muted = "brightness(0) saturate(100%) invert(52%) sepia(10%) saturate(400%) hue-rotate(340deg) brightness(95%)"
scrollbar-track = "transparent"
scrollbar-thumb = "#3a2e2f"
scrollbar-thumb-hover = "#d42a2a"
scrollbar-size = "8px"
scrollbar-radius = "999px"

[tokens]
"--color-scheme" = "dark"
