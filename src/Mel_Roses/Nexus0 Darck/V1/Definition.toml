[colors]
accent = "#87CEFA"
"accent-rgb" = "135, 206, 250"
"accent-hover" = "#64AAD7"
"accent-text" = "#000000"

[text]
primary = "#ADD8E6"
secondary = "#8BB8C9"
muted = "#5A7B8C"

[backgrounds]
main = "#000000"
sidebar = "#0F141A"
card = "#0F141A"
input = "#0A0D12"
"item-active" = "#192028"
surface = "#0F141A"
overlay = "rgba(0, 0, 0, 0.72)"
"sidebar-gradient" = "#0F141A"
"card-gradient" = "#0F141A"
"surface-input" = "#0A0D12"
"surface-dropdown" = "#0F141A"
"surface-hover" = "rgba(255, 255, 255, 0.04)"
"surface-active" = "rgba(255, 255, 255, 0.08)"
"surface-selected" = "rgba(135, 206, 250, 0.15)"
"surface-card" = "rgba(255, 255, 255, 0.02)"

[borders]
color = "rgba(135, 206, 250, 0.18)"
radius = "8px"
"radius-sm" = "4px"
"radius-lg" = "12px"
width = "1px"

[shadows]
"shadow-sm" = "0 2px 8px rgba(0, 0, 0, 0.40)"
"shadow-md" = "0 10px 30px rgba(0, 0, 0, 0.60)"
"shadow-lg" = "0 18px 52px rgba(0, 0, 0, 0.75)"
"glow-accent" = "0 0 0 1px #87CEFA"
"glow-error" = "0 0 0 1px #FF5555"
"glow-success" = "0 0 0 1px #64AAD7"

[layout]
"font-family" = "\"Go3V2\", system-ui, sans-serif"
"font-size-base" = "14px"
"font-size-sm" = "12px"
"font-size-lg" = "16px"
"sidebar-width" = "248px"

[others]
"surface-rgb" = "255, 255, 255"
"icon-filter" = "none"
"icon-filter-error" = "none"
"color-success" = "#64AAD7"
"color-success-rgb" = "100, 170, 215"
"color-error" = "#FF5555"
"color-error-rgb" = "255, 85, 85"
"color-warning" = "#E0F7FF"
"color-warning-rgb" = "224, 247, 255"
"color-info" = "#87CEFA"
"color-info-rgb" = "135, 206, 250"
"color-status-starting" = "#E0F7FF"
"color-status-started" = "#64AAD7"
"scrollbar-track" = "#0F141A"
"scrollbar-thumb" = "#64AAD7"

[backdrop]
dropdown = 0.2
modal = 0.5

[[fonts]]
family = "Go3V2"
src = "fonts/go3v2.ttf"
format = "truetype"
weight = "400"
style = "normal"

[icons]
preview = "icons/preview.png"
