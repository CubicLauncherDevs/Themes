scrollbar-track = "transparent"
scrollbar-thumb = "rgba(216, 214, 206, 0.20)"
scrollbar-thumb-hover = "rgba(216, 214, 206, 0.38)"

[backgrounds]
main = "#090909"
sidebar = "#131313"
sidebar-gradient = "linear-gradient(180deg, #151515 0%, #0d0d0d 100%)"
item-active = "#292928"
card = "rgba(17, 17, 17, 0.86)"
card-gradient = "linear-gradient(135deg, rgba(28,28,27,0.87), rgba(16,16,16,0.80))"
input = "#101010"
overlay = "rgba(0, 0, 0, 0.76)"
surface = "#222221"

[text]
primary = "#eeece5"
secondary = "#bcbab4"
muted = "#a19f99"
tertiary = "#a19f99"

[borders]
color = "rgba(216, 214, 206, 0.12)"
radius = "10px"
radius-sm = "6px"

[shadows]
shadow-sm = "0 2px 6px rgba(0, 0, 0, 0.18)"
shadow-md = "0 6px 20px rgba(0, 0, 0, 0.26)"
shadow-lg = "0 18px 48px rgba(0, 0, 0, 0.50)"
glow-accent = "none"
glow-error = "none"
glow-success = "none"

[backdrop]
modal = 2.0
overlay = 0.0
dropdown = 0.0
panel = 0.0
float = 0.0
viewer = 0.0

[icons]
preview = "bg.png"
