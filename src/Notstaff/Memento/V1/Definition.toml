[background]
reference_path = "bg.png"
image_blur = 0.0
image_opacity = 1.0

[colors]
accent = "#d8d6ce"
accent-rgb = "216, 214, 206"
accent-hover = "#eeece5"
accent-text = "#131313"
accent-primary = "#d8d6ce"
surface-rgb = "216, 214, 206"
surface-hover = "rgba(216, 214, 206, 0.075)"
surface-active = "rgba(216, 214, 206, 0.11)"
surface-selected = "rgba(216, 214, 206, 0.035)"
surface-card = "rgba(17, 17, 17, 0.84)"
surface-input = "rgba(12, 12, 12, 0.94)"
surface-dropdown = "#1b1b1b"
toast-bg = "#1b1b1b"
toast-border = "rgba(216, 214, 206, 0.18)"
border = "rgba(216, 214, 206, 0.12)"
color-success = "#aebda2"
color-success-rgb = "174, 189, 162"
color-error = "#d09c97"
color-error-rgb = "208, 156, 151"
color-warning = "#c6b58e"
color-info = "#a1b1c0"
color-status-starting = "#c6b58e"
