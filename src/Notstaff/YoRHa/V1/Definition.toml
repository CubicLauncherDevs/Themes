[background]
reference_path = "bg.webp"
image_blur = 0.5
image_opacity = 0.68

[colors]
accent = "#6F86B5"
accent-hover = "#8299C8"
accent-active = "#5C73A3"
bg-main = "#111216"
bg-card = "rgba(20, 21, 26, 0.70)"
bg-sidebar = "rgba(12, 13, 17, 0.84)"
bg-sidebar-gradient = "linear-gradient(180deg, rgba(18, 19, 24, 0.86) 0%, rgba(9, 10, 13, 0.82) 100%)"
bg-item-active = "rgba(111, 134, 181, 0.18)"
bg-item-hover = "rgba(232, 230, 223, 0.08)"
bg-overlay = "rgba(7, 8, 11, 0.78)"
border = "rgba(232, 230, 223, 0.13)"
border-color = "rgba(232, 230, 223, 0.13)"
scrollbar-track = "transparent"
scrollbar-thumb = "rgba(232, 230, 223, 0.18)"
scrollbar-thumb-hover = "rgba(111, 134, 181, 0.62)"
success = "#8FAF9B"
warning = "#D2B47A"
error = "#C98181"

[text]
primary = "#ECEAE4"
secondary = "#B8B6B0"
muted = "#85858A"
accent = "#A8B9DB"
inverse = "#111216"

[borders]
color = "rgba(232, 230, 223, 0.13)"
radius = "10px"
radius-sm = "7px"
radius-lg = "14px"

[layout]
sidebar-width = "248px"
spacing = "1rem"
font-size-base = "14px"

[shadows]
shadow-sm = "0 2px 8px rgba(0, 0, 0, 0.22)"
shadow-md = "0 10px 28px rgba(0, 0, 0, 0.34)"
shadow-lg = "0 18px 52px rgba(0, 0, 0, 0.48)"
glow-accent = "0 0 18px rgba(111, 134, 181, 0.24)"

[backgrounds]
input = "rgba(9, 10, 13, 0.72)"
button = "rgba(232, 230, 223, 0.08)"

[backdrop]
modal = 8.0
dropdown = 6.0

[others]
font-family = "Inter, ui-sans-serif, system-ui, sans-serif"
icon-filter = "brightness(0) saturate(100%) invert(92%) sepia(5%) saturate(186%) hue-rotate(7deg) brightness(103%) contrast(89%)"

[icons]
preview = "icons/preview.png"
