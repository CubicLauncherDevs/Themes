secondary = "#cbc9b6"
muted = "#afb29d"
tertiary = "#afb29d"

[borders]
color = "rgba(210, 209, 175, 0.13)"
radius = "14px"
radius-sm = "8px"

[shadows]
shadow-sm = "0 2px 6px rgba(8, 12, 6, 0.16)"
shadow-md = "0 6px 18px rgba(8, 12, 6, 0.23)"
shadow-lg = "0 16px 48px rgba(8, 12, 6, 0.38)"
glow-accent = "none"
glow-error = "none"
