[background]
reference_path = "bg.webp"
image_blur = 0.0
image_opacity = 0.95

[colors]
accent = "#c8c6a0"
accent-rgb = "200, 198, 160"
accent-hover = "#dfdcc0"
accent-text = "#23251b"
