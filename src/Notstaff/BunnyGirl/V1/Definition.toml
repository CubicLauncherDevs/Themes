surface-rgb = "222, 216, 188"
surface-hover = "rgba(222, 216, 188, 0.09)"
surface-active = "rgba(200, 198, 160, 0.14)"
surface-selected = "rgba(200, 198, 160, 0.045)"
surface-card = "rgba(27, 30, 23, 0.72)"
surface-input = "rgba(19, 22, 16, 0.88)"
surface-dropdown = "#25291f"
toast-bg = "#25291f"
toast-border = "rgba(200, 198, 160, 0.22)"
border = "rgba(210, 209, 175, 0.13)"
color-success = "#a7c48a"
color-success-rgb = "167, 196, 138"
color-error = "#e59c90"
color-error-rgb = "229, 156, 144"
color-warning = "#ddc38a"
color-info = "#a4bcc3"
color-status-starting = "#ddc38a"
