[background]
reference_path = "bg.jpg"
image_blur = 0.0
image_opacity = 0.95
mode = "cover"
position = "center"
brightness = 1.0

[colors]
accent = "#c33d52"
accent-rgb = "195, 61, 82"
accent-hover = "#b93a4e"
accent-active = "#a32f42"
accent-primary = "#c33d52"
accent-text = "#fffafb"
accent-subtle = "rgba(195,61,82,0.10)"
color-success = "#3f8f63"
color-success-rgb = "63, 143, 99"
color-error = "#c8404a"
color-error-rgb = "200, 64, 74"
color-warning = "#b07a1e"
color-warning-rgb = "176, 122, 30"
color-info = "#6f86b8"
color-info-rgb = "111, 134, 184"
color-status-starting = "#b07a1e"
color-status-started = "#3f8f63"
color-status-stopped = "#a99aa2"
color-status-error = "#c8404a"
clr-loader-vanilla = "#4f8f74"
clr-loader-fabric = "#8a7a52"
clr-loader-forge = "#c33d52"
clr-loader-quilt = "#8a63a8"

[text]
primary = "#3b2a33"
secondary = "#6d5762"
muted = "#7f6b77"
tertiary = "#7f6b77"
accent = "#c33d52"

[backgrounds]
main = "#fbf6f8"
sidebar = "rgba(255,250,252,0.88)"
card = "rgba(255,252,253,0.93)"
item-active = "#f7dfe6"
overlay = "rgba(60,40,50,0.28)"
input = "#f6edf0"
surface = "rgba(255,252,253,0.90)"

[borders]
color = "rgba(140,95,115,0.18)"
color-hover = "#c33d52"
focus = "var(--accent)"
width = "1px"
radius = "12px"
radius-sm = "8px"
radius-lg = "18px"

[layout]
sidebar-width = "252px"

[typography]
family = "Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif"
size_base = "14px"
size_sm = "12px"
size_label = "11px"
size_control = "13px"
size_lg = "16px"
line_height = "1.5"
weight_normal = "400"
weight_medium = "500"
weight_bold = "600"

[shadows]
shadow-sm = "0 2px 8px rgba(120,70,90,0.08)"
shadow-md = "0 6px 20px rgba(120,70,90,0.10)"
shadow-lg = "0 14px 36px rgba(120,70,90,0.14)"
glow-accent = "0 0 0 3px rgba(195,61,82,0.12)"
glow-accent-strong = "0 0 0 4px rgba(195,61,82,0.18)"
glow-error = "0 0 0 3px rgba(200,64,74,0.14)"
glow-success = "0 0 0 3px rgba(63,143,99,0.14)"

[backdrop]
modal = 10.0
dropdown = 10.0
panel = 8.0
overlay = 6.0
float = 10.0
viewer = 10.0

[others]
surface-rgb = "60, 40, 50"
surface-subtle = "rgba(60,40,50,0.03)"
surface-raised = "rgba(255,255,255,0.55)"
surface-dropdown = "rgba(255,251,253,0.98)"
surface-input = "#f6edf0"
surface-hover = "#f9e9ee"
surface-active = "#f2d6de"
surface-selected = "#f7dfe6"
surface-card = "rgba(255,252,253,0.93)"
toast-bg = "rgba(255,251,253,0.97)"
toast-border = "rgba(140,95,115,0.22)"
button-bg = "rgba(255,255,255,0.72)"
button-hover-bg = "#f9e9ee"
btn-bg = "rgba(255,255,255,0.72)"
item-bg = "rgba(255,255,255,0.58)"
icon-filter = "none"
icon-filter-accent = "brightness(0) saturate(100%) invert(38%) sepia(45%) saturate(1500%) hue-rotate(320deg) brightness(92%) contrast(95%)"
icon-filter-success = "brightness(0) saturate(100%) invert(48%) sepia(30%) saturate(900%) hue-rotate(100deg) brightness(90%)"
icon-filter-error = "brightness(0) saturate(100%) invert(35%) sepia(55%) saturate(2000%) hue-rotate(340deg) brightness(95%)"
icon-filter-warning = "brightness(0) saturate(100%) invert(50%) sepia(60%) saturate(900%) hue-rotate(15deg) brightness(90%)"
icon-filter-info = "brightness(0) saturate(100%) invert(52%) sepia(18%) saturate(800%) hue-rotate(190deg) brightness(95%)"
icon-filter-muted = "brightness(0) saturate(100%) invert(55%) sepia(10%) saturate(300%) hue-rotate(320deg) brightness(95%)"
scrollbar-track = "transparent"
scrollbar-thumb = "rgba(140,95,115,0.30)"
scrollbar-thumb-hover = "rgba(195,61,82,0.55)"
scrollbar-size = "8px"
scrollbar-radius = "999px"

[tokens]
"--color-scheme" = "light"
