name: PR Welcome

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-welcome-{0}', github.event.pull_request.number) || 'pr-welcome' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch base ref
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Validate theme structure
        id: validate
        env:
          BASE_REF: origin/${{ github.base_ref }}
          RESULT_FILE: validation-result.txt
          MESSAGE_FILE: validation-message.md
        run: node scripts/validate-pr.mjs

      - name: Write PR number
        if: always()
        run: printf '%s' '${{ github.event.pull_request.number }}' > pr-number.txt

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts
          path: |
            validation-result.txt
            validation-message.md
            pr-number.txt
          include-hidden-files: false
          if-no-files-found: ignore
